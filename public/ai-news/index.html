<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI News 双语日报 - 归档</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #f5f5f5; color: #333; line-height: 1.8;
}
.container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff; padding: 40px 32px; border-radius: 16px; margin-bottom: 32px;
  text-align: center;
}
.header h1 { font-size: 26px; font-weight: 700; }
.header p { font-size: 14px; opacity: 0.85; margin-top: 8px; }
.report-list { list-style: none; }
.report-list li {
  background: #fff; border-radius: 10px; padding: 20px 24px;
  margin-bottom: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  transition: transform 0.15s;
}
.report-list li:hover { transform: translateY(-2px); }
.report-list a {
  text-decoration: none; color: #333; font-size: 16px; font-weight: 500;
  display: flex; justify-content: space-between; align-items: center;
}
.report-list .date-badge {
  background: #f0f0f0; padding: 4px 12px; border-radius: 20px;
  font-size: 13px; color: #888;
}
.empty {
  text-align: center; color: #aaa; padding: 60px 20px;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>AI News 双语日报</h1>
    <p>每日 AI 行业资讯 · 中英对照 · 自动生成</p>
  </div>
  <ul class="report-list" id="report-list">
    <li class="empty">加载中...</li>
  </ul>
</div>
<script>
(async () => {
  const list = document.getElementById('report-list');
  try {
    const resp = await fetch('/ai-news/index.json');
    if (!resp.ok) throw new Error('no index');
    const files = await resp.json();
    if (files.length === 0) {
      list.innerHTML = '<li class="empty">暂无日报</li>';
      return;
    }
    list.innerHTML = files.map(f => {
      const dateStr = f.replace('.html', '');
      const display = dateStr.replace(/(\d{4})(\d{2})(\d{2})/, '$1年$2月$3日');
      return `<li><a href="/ai-news/${f}"><span>${display} 日报</span><span class="date-badge">查看</span></a></li>`;
    }).join('');
  } catch {
    list.innerHTML = '<li class="empty">暂无日报</li>';
  }
})();
</script>
</body>
</html>
